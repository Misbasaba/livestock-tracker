<!DOCTYPE html>
<html lang="kn">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Livestock Health Tracker</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
      <link rel="manifest" href="manifest.json">
</head>

<body>

    <div id="languagePicker" class="language-picker">
        <div class="picker-content">
            <div class="app-icon">🐄</div>
            <h1>Livestock Health Tracker</h1>
            <p class="subtitle" data-i18n="chooseLanguage"></p>

            <button class="lang-btn" onclick="selectLanguage('kn')">
                <span class="lang-native">ಕನ್ನಡ</span>
                <span class="lang-english">Kannada</span>
            </button>
            <button class="lang-btn" onclick="selectLanguage('hi')">
                <span class="lang-native">हिन्दी</span>
                <span class="lang-english">Hindi</span>
            </button>
            <button class="lang-btn" onclick="selectLanguage('ta')">
                <span class="lang-native">தமிழ்</span>
                <span class="lang-english">Tamil</span>
            </button>
            <button class="lang-btn" onclick="selectLanguage('en')">
                <span class="lang-native">English</span>
                <span class="lang-english">English</span>
            </button>
        </div>
    </div>

    <div id="mainApp" class="d-none">
        <nav class="navbar navbar-dark bg-success">
            <div class="container-fluid">
                <span class="navbar-brand" data-i18n="appName"></span>
                <button class="btn btn-outline-light btn-sm" onclick="openSettings()" data-i18n="settings"></button>
            </div>
        </nav>

        <div class="container mt-3">
            <div class="d-flex justify-content-between align-items-center mb-3">
                <h4 data-i18n="myCattle"></h4>
                <button class="btn btn-success" onclick="openAddAnimal()">
                    + <span data-i18n="addAnimal"></span>
                </button>
            </div>

            <div id="animalList" class="row g-3"></div>
            <div id="emptyState" class="text-center text-muted mt-5">
                <p data-i18n="noAnimals"></p>
            </div>
        </div>
    </div>

    <div id="addAnimalModal" class="modal-overlay d-none">
        <div class="modal-box">
            <h5 data-i18n="addAnimal"></h5>
            <div class="mb-3">
                <label class="form-label" data-i18n="animalName"></label>
                <input type="text" id="inputName" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label" data-i18n="tagNumber"></label>
                <input type="text" id="inputTag" class="form-control">
            </div>
            <div class="mb-3">
                <label class="form-label" data-i18n="species"></label>
                <select id="inputSpecies" class="form-select">
                    <option value="cow" data-i18n="cow"></option>
                    <option value="buffalo" data-i18n="buffalo"></option>
                    <option value="goat" data-i18n="goat"></option>
                    <option value="sheep" data-i18n="sheep"></option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" data-i18n="age"></label>
                <input type="number" id="inputAge" class="form-control" min="1">
            </div>
            <div class="mb-3">
                <label class="form-label" data-i18n="breed"></label>
                <input type="text" id="inputBreed" class="form-control">
            </div>
            <div class="d-flex gap-2">
                <button class="btn btn-success flex-fill" onclick="saveAnimal()" data-i18n="save"></button>
                <button class="btn btn-secondary flex-fill" onclick="closeModal('addAnimalModal')"
                    data-i18n="cancel"></button>
            </div>
        </div>
    </div>

    <div id="animalDetailModal" class="modal-overlay d-none">
        <div class="modal-box">
            <div id="animalDetailContent"></div>
            <button class="btn btn-secondary mt-3 w-100" onclick="closeModal('animalDetailModal')"
                data-i18n="cancel"></button>
        </div>
    </div>

    <div id="settingsModal" class="modal-overlay d-none">
        <div class="modal-box">
            <h5 data-i18n="settings"></h5>
            <div class="mb-3">
                <label class="form-label" data-i18n="language"></label>
                <select id="settingsLang" class="form-select" onchange="changeLanguageFromSettings()">
                    <option value="kn">ಕನ್ನಡ</option>
                    <option value="hi">हिन्दी</option>
                    <option value="ta">தமிழ்</option>
                    <option value="en">English</option>
                </select>
            </div>
            <div class="mb-3">
                <label class="form-label" data-i18n="reminderDays"></label>
                <select id="settingsReminder" class="form-select">
                    <option value="1">1</option>
                    <option value="3" selected>3</option>
                    <option value="7">7</option>
                </select>
            </div>
            <button class="btn btn-secondary w-100" onclick="closeModal('settingsModal')" data-i18n="cancel"></button>
        </div>
    </div>

    <script src="js/translations.js"></script>
    <script src="js/schedule.js"></script>
    <script src="js/voice.js"></script>
    <script src="js/app.js"></script>
</body>
      <script>
    if ('serviceWorker' in navigator) {
      window.addEventListener('load', () => {
        navigator.serviceWorker.register('sw.js');
      });
    }
  </script>

</html>
